# PRODUCTION PROFILE: cgroup v2 is a mandatory isolation boundary.
#
# `autodetect` permits a controlled rolling transition while selecting v2 on
# supported hosts. The entrypoint separately requires a unified writable v2
# hierarchy, so production cannot silently fall back to a rootless simulation.
CgroupPlugin=autodetect

# CPU affinity and cpuset enforcement prevent a job from escaping its granted
# cores. Memory+swap is capped at the allocation; AllowedSwapSpace=0 means the
# combined RAM+swap limit does not exceed allocated RAM.
ConstrainCores=yes
ConstrainRAMSpace=yes
ConstrainSwapSpace=yes
AllowedRAMSpace=100
AllowedSwapSpace=0
MinRAMSpace=30

# Device filtering is required before advertising accelerators or other GRES.
# On cgroup v2 Slurm implements this with eBPF and therefore needs the host
# capability/delegation documented by the production deployment profile.
ConstrainDevices=yes
