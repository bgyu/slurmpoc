# ROOTLESS INTEGRATION PROFILE ONLY.
#
# This file deliberately models scheduling without claiming host isolation.
# cluster-entrypoint selects it only for CLUSTER_DEPLOYMENT_PROFILE=simulation and
# emits a warning when slurmd starts. Production uses slurm.production.conf,
# whose cgroup, namespace, identity and finite-limit settings are materially
# different. Keeping two concrete files prevents an unnoticed environment
# variable from weakening production isolation.
ClusterName=podman
SlurmctldHost=controller

AuthType=auth/munge
CredType=cred/munge
# HS256 exists only in the disposable integration profile.  The key is
# generated on the host, mounted into the controller/slurmdbd, and copied to
# tmpfs.  slurmrestd receives an invalid sentinel token (SLURM_JWT=daemon),
# never this signing key.
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/run/slurm/config/jwt_hs256.key
MpiDefault=none
ProctrackType=proctrack/linuxproc
ReturnToService=2
SlurmctldPidFile=/run/slurm/pids/slurmctld.pid
SlurmdPidFile=/run/slurm/pids/slurmd.pid
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmUser=slurm
SlurmdUser=root
SwitchType=switch/none
TaskPlugin=task/none

# Slurm 26.05 daemons can also serve unauthenticated HTTP health endpoints on
# their RPC ports.  The integration cluster does not need those listeners;
# health checks use authenticated Slurm commands instead.
CommunicationParameters=disable_http

SlurmctldPort=6817
SlurmdPort=6818
SlurmctldTimeout=120
SlurmdTimeout=300

# Configless mode lets dynamically registered local nodes obtain the exact
# controller configuration. MaxNodeCount is a hard ceiling on node growth.
SlurmctldParameters=enable_configless
MaxNodeCount=100
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
# Requiring associations exercises the same ordinary-user boundary as
# production. The controller entrypoint creates only the local demo account;
# production policy is never auto-provisioned.
AccountingStorageEnforce=associations,limits,safe
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30

# Rootless Podman cannot report or delegate a stable writable cgroup subtree.
# The entrypoint supplies a synthetic two-CPU shape with `slurmd -Z --conf`;
# config_overrides accepts that shape even though `slurmd -C` sees the WSL VM.
# Production rejects this setting and uses explicit FUTURE/CLOUD profiles.
SlurmdParameters=config_overrides
PartitionName=debug Nodes=ALL Default=YES DefaultTime=00:05:00 MaxTime=01:00:00 State=UP
