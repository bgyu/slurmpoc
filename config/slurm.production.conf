# PRODUCTION PROFILE.
#
# Hostnames and resource shapes are safe examples, not service discovery.
# Production orchestration should mount a root-owned, non-writable replacement
# via SLURM_CONFIG_FILE when site names differ. The entrypoint still checks the
# isolation-critical settings below before starting a daemon.
ClusterName=production
SlurmctldHost=controller-primary
SlurmctldHost=controller-backup

AuthType=auth/munge
CredType=cred/munge
# Only public JWKS trust is present in Slurm. Token creation remains disabled;
# the identity provider retains the private RS256 signing key.
AuthAltTypes=auth/jwt
AuthAltParameters=jwks=/run/slurm/config/slurm-jwks.json,userclaimfield=preferred_username,disable_token_creation

# All internal Slurm RPC listeners use TLS 1.3-capable s2n. Each role receives
# only its own certificate/key at the common paths below. Missing irrelevant
# role files are acceptable; a role never receives another role's private key.
TLSType=tls/s2n
TLSParameters=ca_cert_file=/run/slurm/config/ca_cert.pem,ctld_cert_file=/run/slurm/config/ctld_cert.pem,ctld_cert_key_file=/run/slurm/config/ctld_cert_key.pem,restd_cert_file=/run/slurm/config/restd_cert.pem,restd_cert_key_file=/run/slurm/config/restd_cert_key.pem,slurmd_cert_file=/run/slurm/config/slurmd_cert.pem,slurmd_cert_key_file=/run/slurm/config/slurmd_cert_key.pem

DisableRootJobs=YES
MpiDefault=none
ProctrackType=proctrack/cgroup
ReturnToService=1
SlurmctldPidFile=/run/slurm/pids/slurmctld.pid
SlurmdPidFile=/run/slurm/pids/slurmd.pid
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmUser=slurm
SlurmdUser=root
SwitchType=switch/none
TaskPlugin=task/cgroup,task/affinity

# Slurm 26.05 otherwise accepts HTTP on its normal RPC listeners.  Production
# monitoring goes through authenticated commands/private service endpoints,
# so clear-text HTTP is disabled on slurmctld and slurmd.
CommunicationParameters=disable_http

# namespace/tmpfs gives every job a private /tmp and /dev/shm. Containment is
# intentionally absent from the rootless simulation because mount namespaces
# and their cleanup cannot be proven there.
NamespaceType=namespace/tmpfs
PrologFlags=Contain

SlurmctldPort=6817
SlurmdPort=6818
SlurmctldTimeout=120
SlurmdTimeout=300
MessageTimeout=30

# Bounded controller and job cardinality limit accidental or malicious fanout.
# Chunk work should still be submitted as one throttled array, not N RPCs.
SlurmctldParameters=enable_configless
MaxNodeCount=1000
MaxJobCount=100000
MaxArraySize=100001
MaxStepCount=10000
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd-primary
AccountingStorageBackupHost=slurmdbd-backup
AccountingStoragePort=6819
AccountingStorageEnforce=associations,limits,qos,safe
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=30
PrivateData=accounts,events,jobs,reservations,usage,users

# This bounded FUTURE pool is an identity budget, not an instruction to create
# hosts. A lifecycle service provisions an approved shape, then slurmd claims a
# compatible identity with -Fcpu-standard. Node removal must drain first.
NodeName=compute[0001-0100] CPUs=4 Boards=1 SocketsPerBoard=1 CoresPerSocket=4 ThreadsPerCore=1 RealMemory=15360 Feature=cpu-standard State=FUTURE
PartitionName=standard Nodes=ALL Default=YES DefaultTime=00:10:00 MaxTime=1-00:00:00 DefMemPerCPU=1024 MaxMemPerCPU=3840 State=UP
