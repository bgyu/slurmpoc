# Install as /etc/tmpfiles.d/slurm-production.conf.  These are tmpfs directory
# skeletons only: a secret/PKI agent must populate files after every boot.
# Search-only permits the fixed consuming UID to reach its own mode-0400 file
# after the directory is mounted read-only.  The missing read bit prevents
# unprivileged host users from listing names; only root may create entries.
d /run/slurm-secrets                 0711 root  root  -
d /run/slurm-pki                     0711 root  root  -
d /run/slurm-pki/controller-primary  0700 root  root  -
d /run/slurm-pki/controller-backup   0700 root  root  -
d /run/slurm-pki/slurmdbd-primary    0700 root  root  -
d /run/slurm-pki/slurmdbd-backup     0700 root  root  -
d /run/slurm-pki/slurmrestd-a        0700 root  root  -
d /run/slurm-pki/slurmd              0700 root  root  -
# Resume/Suspend programs execute as SlurmUser (numeric identity 64030).
d /run/slurm-pki/lifecycle           0700 64030 64030 -
